name: S3 Bucket Sync

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  sync-s3-files:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Parse config
        run: |
          CONFIG='${{ secrets.CONFIG }}'
          echo "$CONFIG" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> $GITHUB_ENV
          echo "$CONFIG" | jq -r '.[]' | while read -r value; do
            [ -n "$value" ] && echo "::add-mask::$value"
          done

      - name: Generate Markdown navigation and redirect manifest
        run: node .github/scripts/generate-nav.mjs

      - name: Sync files to S3
        run: |
          mapfile -t stubs < <(jq -r '.[].key' "$RUNNER_TEMP/redirect-stubs.json")
          exclusions=()
          for key in "${stubs[@]}"; do
            exclusions+=(--exclude "$key")
          done

          aws s3 sync ./ s3://${{ env.S3_BUCKET_NAME }}/blog/ \
            --exclude "*" \
            --include "*.md" \
            --exclude ".git/*" \
            --exclude ".git" \
            --exclude ".github/*" \
            --exclude ".obsidian/*" \
            --exclude "logseq/*" \
            --exclude ".claude/*" \
            "${exclusions[@]}" \
            --content-type "text/markdown; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete

          aws s3 sync ./ s3://${{ env.S3_BUCKET_NAME }}/blog/ \
            --exclude "*" \
            --include "*.jsonl" \
            --include "*.json" \
            --exclude ".git/*" \
            --exclude ".git" \
            --exclude ".github/*" \
            --exclude ".obsidian/*" \
            --exclude "logseq/*" \
            --exclude ".claude/*" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete

          aws s3 sync ./ s3://${{ env.S3_BUCKET_NAME }}/blog/ \
            --exclude "*" \
            --include "llms.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete

          # The .md sync deletes dropped redirect keys; active stubs are excluded above.
          : > "$RUNNER_TEMP/redirect-empty"
          while IFS=$'\t' read -r key location; do
            aws s3api put-object \
              --bucket "${{ env.S3_BUCKET_NAME }}" \
              --key "blog/$key" \
              --body "$RUNNER_TEMP/redirect-empty" \
              --website-redirect-location "$location" \
              --content-type "text/markdown; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate"
          done < <(jq -r '.[] | [.key, .location] | @tsv' "$RUNNER_TEMP/redirect-stubs.json")

          aws s3 sync ./ s3://${{ env.S3_BUCKET_NAME }}/blog/ \
            --exclude "*" \
            --include "images/*" \
            --cache-control "public, max-age=3600" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/blog/*"

      - name: Trigger deployment
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/${{ secrets.TARGET_REPO }}/dispatches \
            -d '{"event_type":"deploy"}'
