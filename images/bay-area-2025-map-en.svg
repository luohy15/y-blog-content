<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">Six Days in the Bay Area</title><desc id="desc">Six Days in the Bay Area. Schematic · North up, not to scale · Places, not full routes · Private and unconfirmed venues omitted. Day 0 / Arrive; Golden Gate Bridge / Car break-in; police report; Day 1 / Shooting range; Stanford / Meet a friend; In-N-Out; Day 2 / Cupertino → Big Sur / Highway 1; Monterey dinner; Day 3 / Daeho; Half Moon Bay / Sunset on the coast; Day 4 / SF consulate; flying experience / Travel document issued; Day 5 / Blue Bottle; fly home / Coffee before departure. Trip days only, not calendar dates. Excursion inset uses a different scale.</desc>
<style>
    svg { color-scheme:light dark; --paper:#fcfcfb; --ink:#0b0b0b; --muted:#52514e; --line:#e1e0d9; --water:#e6eff5; --park:#e9eddf; --accent:#2a78d6; --land:#f5f4ef; }
    @media (prefers-color-scheme:dark) { svg { --paper:#1a1a19; --ink:#ffffff; --muted:#c3c2b7; --line:#383835; --water:#24323e; --park:#30382b; --accent:#3987e5; --land:#222220; } }
    text { font-family:'DejaVu Sans','Noto Sans CJK SC',sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .small { font-size:16px; } .label { font-size:20px; font-weight:600; }
    .day { font-size:17px; font-weight:600; } .pin { fill:var(--accent); stroke:var(--paper); stroke-width:3; }
    .leader { fill:none; stroke:var(--muted); stroke-width:1.2; } .rule { stroke:var(--line); stroke-width:1; }
</style>
