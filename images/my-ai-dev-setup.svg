<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title description">
  <title id="title">My AI development setup</title>
  <desc id="description">Left to right: y-agent is the same entry point across devices, with Web/Safari and integrated Telegram input; Claude Code is the runtime; a self-hosted relay handles model access. Claude, GPT, and Grok are grouped as model sources beside the relay, without an asserted common transport. A side branch from y-agent and Claude Code connects separate files on EC2 and data on RDS. Memory is not a serial forwarding hop. Provider routes, subscription terms, and remote inference are explained in the article.</desc>
