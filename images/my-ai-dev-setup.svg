    svg { color-scheme: light; --background: #ffffff; --foreground: #0a0a0a; --accent: #f5f5f5; --ink: #737373; }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: var(--foreground); text-anchor: middle; }
    .name { font-size: 25px; font-weight: 600; }
    .label { font-size: 20px; }
    .box { fill: var(--accent); stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .line { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  </style>
