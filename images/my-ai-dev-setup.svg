<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" role="img" aria-labelledby="title description">
  <title id="title">My AI dev setup: one entry point, a cloud workspace</title>
  <desc id="description">Desktop, tablet, and phone access the same y-agent system through Web or Safari and an integrated Telegram conversation interface. y-agent orchestrates Claude Code sessions. Persistent context is connected at the side: files on EC2 and structured data on RDS are separate stores, not model forwarding hops. A self-hosted relay handles model access. Claude, GPT, and Grok subscriptions are model sources, not a promise of a shared transport or compatibility. Model inference is remote.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#52606d" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .heading { font-size: 30px; font-weight: 700; }
      .name { font-size: 24px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; fill: #52606d; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; fill: #52606d; }
      .box { fill: #ffffff; stroke: #aab4be; stroke-width: 1.5; }
      .line { fill: none; stroke: #52606d; stroke-width: 2; }
    </style>
  </defs>
  <rect width="960" height="1100" rx="20" fill="#f5f7f9"/>
  <text class="label" x="40" y="40">MY AI DEV SETUP</text>
  <text class="heading" x="40" y="82">One entry point. Same workspace.</text>
  <text class="body" x="40" y="117">The device changes. The task and its context stay together.</text>

  <rect class="box" x="40" y="148" width="880" height="150" rx="12"/>
  <text class="name" x="64" y="184">Desktop · Tablet · Phone</text>
  <text class="small" x="64" y="215">Two interfaces into the same system</text>
  <rect x="64" y="237" width="250" height="42" rx="7" fill="#edf0f3"/>
  <text class="body" x="80" y="265">Web / Safari UI</text>
  <rect x="334" y="237" width="560" height="42" rx="7" fill="#edf0f3"/>
  <text class="body" x="350" y="265">Telegram: integrated conversation input</text>

  <path class="line" d="M 265 298 V 350" marker-end="url(#arrow)"/>
  <text class="small" x="282" y="331">requests / results</text>
  <rect class="box" x="40" y="352" width="450" height="116" rx="12"/>
  <text class="label" x="64" y="382">UNIVERSAL ENTRY POINT</text>
  <text class="name" x="64" y="416">y-agent</text>
  <text class="body" x="64" y="446">Tasks · context · session orchestration</text>

  <path class="line" d="M 265 468 V 538" marker-end="url(#arrow)"/>
  <text class="small" x="282" y="507">dispatch / handoff</text>
  <rect class="box" x="40" y="540" width="450" height="116" rx="12"/>
  <text class="label" x="64" y="570">RUNTIME</text>
  <text class="name" x="64" y="604">Claude Code</text>
  <text class="body" x="64" y="634">Read code · edit files · run commands</text>

  <rect x="626" y="352" width="294" height="304" rx="12" fill="#edf0f3"/>
  <text class="label" x="648" y="382">PERSISTENT CONTEXT</text>
  <rect class="box" x="646" y="402" width="254" height="96" rx="8"/>
  <text class="name" x="664" y="435">Files on EC2</text>
  <text class="small" x="664" y="462">Code · plans · notes</text>
  <text class="small" x="664" y="484">Project conventions</text>
  <rect class="box" x="646" y="514" width="254" height="96" rx="8"/>
  <text class="name" x="664" y="547">Database on RDS</text>
  <text class="small" x="664" y="574">Tasks · chats · links</text>
  <text class="small" x="664" y="596">Structured state</text>
  <text class="small" x="648" y="639">Separate stores, not a pipeline</text>
  <path class="line" d="M 490 410 H 546 V 598 H 490"/>
  <path class="line" d="M 546 504 H 626" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="small" x="552" y="461">read /</text>
  <text class="small" x="552" y="485">write</text>

  <path class="line" d="M 265 656 V 724" marker-end="url(#arrow)"/>
  <text class="small" x="282" y="697">model access</text>
  <rect class="box" x="40" y="726" width="450" height="116" rx="12"/>
  <text class="label" x="64" y="756">GATEWAY</text>
  <text class="name" x="64" y="790">Self-hosted relay</text>
  <text class="body" x="64" y="820">Own fork of claude-relay-service</text>
  <text class="small" x="626" y="763">Work records are mine.</text>
  <text class="small" x="626" y="793">Model inference is remote.</text>
  <text class="small" x="626" y="823">Context leaves the workspace.</text>

  <path class="line" d="M 265 842 V 902" stroke-dasharray="6 6"/>
  <text class="small" x="282" y="879">conceptual link, not a transport map</text>
  <rect class="box" x="40" y="904" width="880" height="154" rx="12"/>
  <text class="label" x="64" y="936">MODEL SOURCES</text>
  <text class="name" x="64" y="973">Claude / GPT / Grok subscriptions</text>
  <text class="body" x="64" y="1009">Routes, tool support, and subscription terms must be checked separately.</text>
  <text class="small" x="64" y="1037">This does not imply one shared transport or interchangeable subscription APIs.</text>
</svg>
