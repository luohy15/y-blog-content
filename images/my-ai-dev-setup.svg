<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title description">
  <title id="title">My personal agent setup</title>
  <desc id="description">Left to right: y-agent is the same entry point across devices, with Web/Safari and integrated Telegram input; an agent CLI (Claude Code, Codex, or Pi) runs the chat on the selected execution node; a self-hosted relay handles model access. Claude, GPT, and Grok are grouped as model sources beside the relay, without an asserted common transport. A branch from y-agent connects data on RDS; a branch from the agent CLI connects files on the execution node. Memory is not a serial forwarding hop. Provider routes, subscription terms, remote inference, and per-chat backend pinning are explained in the article.</desc>
