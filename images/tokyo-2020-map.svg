<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">东京五日</title><desc id="desc">东京五日. 示意图 · 上北下南，不按比例 · 标地点，不描绘完整路线 · 隐去私人及未确认地点. Day 0 / 羽田 → 六本木 / 抵达、入住; Day 1 / 浅草；上野；六本木 / 寺庙、公园与夜景; Day 2 / 江之岛 → 镰仓 / 取景地与海边日落; Day 3 / 代代木 → 原宿 / 表参道；涩谷; Day 4 / 东京站 → 羽田 / 买纪念品；回程. 仅标旅行日，不标日历日期。远足小图比例独立。</desc>
<style>
    svg { color-scheme:light dark; --paper:#fcfcfb; --ink:#0b0b0b; --muted:#52514e; --line:#e1e0d9; --water:#e6eff5; --park:#e9eddf; --accent:#2a78d6; --land:#f5f4ef; }
    @media (prefers-color-scheme:dark) { svg { --paper:#1a1a19; --ink:#ffffff; --muted:#c3c2b7; --line:#383835; --water:#24323e; --park:#30382b; --accent:#3987e5; --land:#222220; } }
    text { font-family:'DejaVu Sans','Noto Sans CJK SC',sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .small { font-size:16px; } .label { font-size:20px; font-weight:600; }
    .day { font-size:17px; font-weight:600; } .pin { fill:var(--accent); stroke:var(--paper); stroke-width:3; }
    .leader { fill:none; stroke:var(--muted); stroke-width:1.2; } .rule { stroke:var(--line); stroke-width:1; }
</style>
